.core-defs:
  variables:
    CORENAME: riverhorse
    EXTRA_PATH: src/riverhorse-libretro
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
    CORE_ARGS: >-
      -DBUILD_QT_FRONTEND=OFF -DBUILD_LIBRETRO_CORE=ON -DENABLE_DESKTOP_INTEGRATION=OFF
      -DUSE_BUNDLED_DEPENDENCIES=ON
    API_LEVEL: 24

include:
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: 'osx-cmake-x86.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: 'osx-cmake-arm64.yml'

stages:
  - build-prepare
  - build-shared

libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:backports
  variables:
    CORE_ARGS: >-
      -DBUILD_QT_FRONTEND=OFF -DBUILD_LIBRETRO_CORE=ON -DENABLE_DESKTOP_INTEGRATION=OFF
      -DUSE_BUNDLED_DEPENDENCIES=ON -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs

libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs

android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs

android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .core-defs

libretro-build-osx-x64:
  extends:
    - .libretro-osx-cmake-x86_64
    - .core-defs
  variables:
    MACOSX_DEPLOYMENT_TARGET: "10.15"

libretro-build-osx-arm64:
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs
