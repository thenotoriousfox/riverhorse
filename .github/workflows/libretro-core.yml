name: libretro core

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.15"
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_FRONTEND=OFF -DBUILD_LIBRETRO_CORE=ON \
          -DENABLE_DESKTOP_INTEGRATION=OFF -DUSE_BUNDLED_DEPENDENCIES=ON \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} . -Bbuild
        cmake --build build --target riverhorse_libretro --config Release -- -j "$(sysctl -n hw.ncpu)" -k
        otool -l build/src/riverhorse-libretro/riverhorse_libretro.dylib | grep -A5 'platform macos\|LC_VERSION_MIN_MACOSX' || true
        otool -L build/src/riverhorse-libretro/riverhorse_libretro.dylib

    - uses: actions/upload-artifact@v4
      with:
        name: riverhorse_libretro-macos-${{ matrix.arch }}
        path: build/src/riverhorse-libretro/riverhorse_libretro.dylib
        retention-days: 7
