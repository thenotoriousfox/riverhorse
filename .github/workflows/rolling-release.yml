name: Release

on:
  push:
    tags:
      - '*'

jobs:
  windows-build:
    uses: ./.github/workflows/windows-build.yml

  linux-build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install packages
      shell: bash
      run: |
        # Workaround for https://github.com/actions/runner-images/issues/675
        scripts/retry.sh wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo scripts/retry.sh apt-add-repository -n 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main'

        sudo scripts/retry.sh apt-get update &&
        sudo scripts/retry.sh apt-get -y install \
          build-essential clang-17 cmake curl extra-cmake-modules git libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdecor-0-dev libegl-dev libevdev-dev \
          libfontconfig-dev libfreetype-dev libfuse2 libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libinput-dev libopengl-dev libpipewire-0.3-dev libpulse-dev \
          libssl-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev libxcb-damage0-dev libxcb-glx0-dev \
          libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-shape0-dev \
          libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxext-dev libxkbcommon-x11-dev libxrandr-dev lld-17 \
          llvm-17 ninja-build patchelf pkg-config zlib1g-dev

    - name: Cache Dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: ~/deps
        key: deps ${{ matrix.arch }} ${{ hashFiles('scripts/deps/build-dependencies-linux.sh') }}

    - name: Build Dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-linux.sh "$HOME/deps"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Tag as release build
      run: |
        echo '#define SCM_RELEASE_ASSET "Riverhorse-${{ matrix.arch }}.AppImage"' >> src/scmversion/tag.h


    - name: Compile build
      shell: bash
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_PREFIX_PATH="$HOME/deps" -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" ..
        cmake --build . --parallel
        cd ..
        scripts/appimage/make-appimage.sh $(realpath .) $(realpath ./build) $HOME/deps Riverhorse-${{ matrix.arch }}

    - name: Upload Qt AppImage
      uses: actions/upload-artifact@v4
      with:
        name: "linux-${{ matrix.arch }}-appimage-qt"
        path: "Riverhorse-${{ matrix.arch }}.AppImage"
        retention-days: 1


  linux-libretro-build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install packages
      shell: bash
      run: |
        scripts/retry.sh wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo scripts/retry.sh apt-add-repository -n 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main'

        sudo scripts/retry.sh apt-get update &&
        sudo scripts/retry.sh apt-get -y install \
          build-essential clang-17 cmake curl extra-cmake-modules git libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdecor-0-dev libegl-dev libevdev-dev \
          libfontconfig-dev libfreetype-dev libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libinput-dev libopengl-dev libpipewire-0.3-dev libpulse-dev \
          libssl-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxkbcommon-x11-dev libxrandr-dev lld-17 \
          llvm-17 ninja-build patchelf pkg-config zip zlib1g-dev

    - name: Cache Dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: ~/deps
        key: deps libretro ${{ matrix.arch }} ${{ hashFiles('scripts/deps/build-dependencies-linux.sh') }}

    - name: Build Dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-linux.sh --libretro "$HOME/deps"

    - name: Compile core
      shell: bash
      run: |
        echo '#pragma once' > src/scmversion/tag.h
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/deps" -DCMAKE_C_COMPILER=clang-17 \
          -DCMAKE_CXX_COMPILER=clang++-17 -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
          -DBUILD_QT_FRONTEND=OFF -DBUILD_LIBRETRO_CORE=ON
        cmake --build build --parallel --target riverhorse_libretro
        scripts/libretro/make-libretro-package.sh build/src/riverhorse-libretro/riverhorse_libretro.so . "linux-${{ matrix.arch }}"

    - name: Upload libretro core
      uses: actions/upload-artifact@v4
      with:
        name: "linux-${{ matrix.arch }}-libretro"
        path: riverhorse_libretro-linux-${{ matrix.arch }}.zip
        retention-days: 1


  libretro-cores:
    uses: ./.github/workflows/libretro-cores.yml


  linux-flatpak-build:
    strategy:
      matrix:
        include:
          - arch: x64
            flatpak_arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            flatpak_arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.7
      options: --privileged
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

    # Work around container ownership issue
    - name: Set Safe Directory
      shell: bash
      run: git config --global --add safe.directory "*"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Generate AppStream XML
      run: |
        scripts/generate-metainfo.sh scripts/flatpak
        cat scripts/flatpak/io.github.thenotoriousfox.Riverhorse.metainfo.xml

    - name: Validate AppStream XML
      run: appstreamcli validate --no-net --explain scripts/flatpak/io.github.thenotoriousfox.Riverhorse.metainfo.xml

    - name: Validate manifest
      run: flatpak-builder-lint --exceptions --user-exceptions scripts/flatpak/lint-exceptions.json manifest scripts/flatpak/io.github.thenotoriousfox.Riverhorse.yaml

    - name: Build Flatpak
      uses: flathub-infra/flatpak-github-actions/flatpak-builder@23796715b3dfa4c86ddf50cf29c3cc8b3c82dca8
      with:
        bundle: riverhorse-${{ matrix.arch }}.flatpak
        upload-artifact: false
        manifest-path: scripts/flatpak/io.github.thenotoriousfox.Riverhorse.yaml
        arch: ${{ matrix.flatpak_arch }}
        build-bundle: true
        verbose: true
        mirror-screenshots-url: https://dl.flathub.org/media
        branch: stable
        cache: true
        restore-cache: true
        cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('scripts/flatpak/**/*.yaml') }}

    - name: Upload Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: "linux-${{ matrix.arch }}-flatpak"
        path: "riverhorse-${{ matrix.arch }}.flatpak"
        retention-days: 1


  macos-build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Xcode 16.4
      run: sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Install packages
      shell: bash
      run: |
        brew install curl ninja

    - name: Cache Dependencies
      id: cache-deps-mac
      uses: actions/cache@v4
      with:
        path: ~/deps
        key: deps-mac ${{ hashFiles('scripts/deps/build-dependencies-mac.sh') }}

    - name: Build Dependencies
      if: steps.cache-deps-mac.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-mac.sh "$HOME/deps"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Tag as release build
      run: |
        echo '#define SCM_RELEASE_ASSET "riverhorse-mac-release.zip"' >> src/scmversion/tag.h

    - name: Compile and zip .app
      shell: bash
      run: |
        mkdir build
        cd build
        export MACOSX_DEPLOYMENT_TARGET=11.0
        cmake -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENGL=OFF -DCMAKE_PREFIX_PATH="$HOME/deps" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -G Ninja ..
        cmake --build . --parallel
        mv bin/Riverhorse.app .
        codesign -s - --deep -f -v Riverhorse.app
        zip -r riverhorse-mac-release.zip Riverhorse.app/

    - name: Upload macOS .app
      uses: actions/upload-artifact@v4
      with:
        name: "macos"
        path: "build/riverhorse-mac-release.zip"
        retention-days: 1


  create-release:
    needs: [windows-build, linux-build, linux-libretro-build, libretro-cores, linux-flatpak-build, macos-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.RIVERHORSE_DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: Display Downloaded Artifacts
        run: find ./artifacts/

      - name: Create release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            ./artifacts/windows/riverhorse-windows-x64-release.zip
            ./artifacts/windows/riverhorse-windows-x64-release-symbols.zip
            ./artifacts/windows-arm64/riverhorse-windows-arm64-release.zip
            ./artifacts/windows-arm64/riverhorse-windows-arm64-release-symbols.zip
            ./artifacts/linux-x64-appimage-qt/Riverhorse-x64.AppImage
            ./artifacts/linux-arm64-appimage-qt/Riverhorse-arm64.AppImage
            ./artifacts/linux-x64-libretro/riverhorse_libretro-linux-x64.zip
            ./artifacts/linux-arm64-libretro/riverhorse_libretro-linux-arm64.zip
            ./artifacts/linux-armhf-libretro/riverhorse_libretro-linux-armhf.zip
            ./artifacts/windows-x64-libretro/riverhorse_libretro-windows-x64.zip
            ./artifacts/android-arm64-v8a-libretro/riverhorse_libretro-android-arm64-v8a.zip
            ./artifacts/android-armeabi-v7a-libretro/riverhorse_libretro-android-armeabi-v7a.zip
            ./artifacts/android-x86_64-libretro/riverhorse_libretro-android-x86_64.zip
            ./artifacts/macos-arm64-libretro/riverhorse_libretro-macos-arm64.zip
            ./artifacts/macos-x86_64-libretro/riverhorse_libretro-macos-x86_64.zip
            ./artifacts/linux-x64-flatpak/riverhorse-x64.flatpak
            ./artifacts/linux-arm64-flatpak/riverhorse-arm64.flatpak
            ./artifacts/macos/riverhorse-mac-release.zip

      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK != ''
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          [ -s release-notes.md ] || echo "See the release page for details." > release-notes.md
          jq -n --arg title "🦛  Riverhorse ${GITHUB_REF_NAME#v}" --arg url "$url" --rawfile notes release-notes.md '
            ($notes | if length > 3800 then .[:3800] + "…" else . end) as $body
            | {username: "Riverhorse",
               avatar_url: "https://raw.githubusercontent.com/thenotoriousfox/riverhorse/main/data/resources/images/riverhorse.png",
               embeds: [{title: $title, url: $url, color: 8076770,
                         description: ($body + "\n\n**[Download](" + $url + ")**")}]}' > discord.json
          curl -fsS -H "Content-Type: application/json" --data @discord.json "$DISCORD_WEBHOOK"
