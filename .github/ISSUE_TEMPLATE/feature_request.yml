name: Feature request
description: Suggest something new or an improvement
labels: [enhancement]
body:

- type: markdown
  attributes:
    value: |
      One feature per issue. Check [CONTRIBUTING.md](https://github.com/thenotoriousfox/riverhorse/blob/main/CONTRIBUTING.md) for what Riverhorse does not take (non-PS1 hardware such as expanded VRAM, telemetry, account-based services).

- type: textarea
  attributes:
    label: Problem
    description: What are you trying to do, and what stops you?
  validations:
    required: true

- type: textarea
  attributes:
    label: Proposed solution
    description: What would you like Riverhorse to do?
  validations:
    required: true

- type: textarea
  attributes:
    label: Alternatives
    description: Other ways you have tried or considered.
  validations:
    required: false
