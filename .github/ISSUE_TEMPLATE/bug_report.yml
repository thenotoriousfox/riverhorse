name: Bug report
description: Something in Riverhorse does not work as it should
labels: [bug]
body:

- type: markdown
  attributes:
    value: |
      Before you report:
      1. Search [open and closed issues](https://github.com/thenotoriousfox/riverhorse/issues?q=is%3Aissue) for the same problem.
      2. Reproduce it with enhancements off (internal resolution 1x, PGXP off, no widescreen hack, no cheats or patches) and other settings at their defaults, unless the bug is in one of those.
      3. Check your BIOS and disc dumps. PAL games with LibCrypt protection need their `.sbi` file in the `subchannels` folder.
      4. For game-specific emulation bugs, use the **Game compatibility** form instead.

- type: dropdown
  attributes:
    label: Where do you run Riverhorse?
    options:
      - Standalone (AppImage)
      - Standalone (Flatpak)
      - Standalone (built from source)
      - Packaged by a distribution or frontend (say which below)
      - libretro core in RetroArch
      - Other (say below)
  validations:
    required: true

- type: input
  attributes:
    label: Riverhorse version
    description: From Help > About, the libretro core's info, or the commit you built.
  validations:
    required: true

- type: textarea
  attributes:
    label: What happens
    description: What you see or hear, and what you expected instead. Screenshots and video help.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: From starting Riverhorse to the problem.
  validations:
    required: true

- type: textarea
  attributes:
    label: System
    description: Distribution and version, CPU, GPU and driver version, renderer (Software, OpenGL, Vulkan).
  validations:
    required: true

- type: textarea
  attributes:
    label: Log
    description: |
      Turn on Settings > Advanced > Log to File, reproduce the problem and attach `riverhorse.log` from the user directory.
      For the libretro core, attach RetroArch's log with logging verbosity on.
  validations:
    required: false
